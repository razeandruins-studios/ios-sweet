name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (SWEET or CURTANA)
        default: "SWEET"
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script and patches
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # Inject 0098 make-support script (runs before patches via DXB *.sh pipeline).
          cp xnu/patches/0098-curtana-make-support.sh dxb/patches/
          # Inject the consolidated CURTANA patch.
          cp xnu/patches/0099-curtana-full-series.patch dxb/patches/
          # Stage external sources required by CURTANA.
          # DXB runs *.sh before *.patch, so these populate sweet_libpthread/, sweet_bearssl/, sweet_hfs/ first
          cp xnu/patches/0019-stage-libpthread.sh dxb/patches/
          cp xnu/patches/0020-stage-bearssl.sh dxb/patches/
          cp xnu/patches/0026-stage-hfs.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET/CURTANA kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sudo xcode-select --install || true
          sw_vers
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | head -1 || echo "")
          if [ -n "$XC" ]; then
            echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
            sudo xcode-select -s "$XC"
          fi
          if [ -n "$XC" ]; then
            xcodebuild -version
            xcrun --find iig || echo "iig not found"
          fi

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || echo "")
          mkdir -p sdk-kernel-platform 2>/dev/null || true
          TARGET_SITE_SDK="$SDK"
          if [ -n "$TARGET_SITE_SDK" ] && [ -d "$TARGET_SITE_SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" ]; then
            cp -R "$TARGET_SITE_SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ 2>/dev/null || true
          fi
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu 2>/dev/null || true
          ls -la buildtree.tgz 2>/dev/null || echo "No buildtree.tgz"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            [ -e "$lib" ] || continue
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs 2>/dev/null || echo "No KDK libs"

      - name: Collect
        if: always()
        run: |
          mkdir -p out/kernel
          # Strategy 1: Standard fakeroot path from make install
          if [ -d "dxb/fakeroot/System/Library/Kernels" ]; then
            find dxb/fakeroot/System/Library/Kernels -type f -size +1M \
              -exec cp {} out/kernel/ \; 2>/dev/null || true
          fi
          # Strategy 2: OBJROOT nested Binary/ directory (most reliable)
          # Kernel lands at xnu.obj/DEVELOPMENT_ARM64_SWEET/Binary/kernel.* — must NOT use maxdepth 1
          if [ -z "$(ls out/kernel/ 2>/dev/null)" ]; then
            find dxb/build/xnu.obj -name 'kernel.*' -size +1M \
              -exec cp {} out/kernel/ \; 2>/dev/null || true
          fi
          # Strategy 3: SYMROOT fallback (any nested location)
          if [ -z "$(ls out/kernel/ 2>/dev/null)" ] && [ -d "dxb/build/xnu.sym" ]; then
            find dxb/build/xnu.sym -name 'kernel.*' -size +1M \
              -exec cp {} out/kernel/ \; 2>/dev/null || true
          fi
          echo "--- Kernel artifact contents ---"
          ls -la out/kernel/ 2>/dev/null || echo "WARNING: No kernel found"
          # Validate each file is a real Mach-O binary
          for f in out/kernel/*; do
            [ -f "$f" ] || continue
            t=$(file "$f" 2>/dev/null || echo "unknown")
            echo "  $f => $t"
            if echo "$t" | grep -qi "arm\|mach-o\|executable\|object"; then
              echo "  ✓ Valid kernel binary ($(du -h "$f" | cut -f1))"
            else
              echo "  ⚠ Possible false positive: $t"
            fi
          done
          (cd out && find . -type f -exec shasum -a 256 {} + > SHA256SUMS 2>/dev/null || true)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          retention-days: 7
          if-no-files-found: warn
